server:
  port: 8080

spring:
  application:
    name: mcp-host
  profiles:
    active: local

  ai:
    chat:
      observations:
        log-prompt: true
        log-completion: true
      client:
        observations:
          log-prompt: true
          log-completion: true
  
  # ========== Nacos 服务发现 ==========
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        enabled: true
    
    # ========== LoadBalancer 配置 ==========
    loadbalancer:
      ribbon:
        enabled: false  # 使用 Spring Cloud LoadBalancer 而非 Ribbon
      cache:
        enabled: true
        ttl: 35s  # 缓存服务实例列表 35 秒

  # ========== Redis 配置 ==========
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      timeout: 3000ms

  # ========== 数据源配置 ==========
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # ========== SQL 初始化 ==========
  sql:
    init:
      mode: never  # 改为never，只在首次部署时手动执行schema.sql
      schema-locations: classpath:db/migration/schema.sql
      continue-on-error: true





# ========== MyBatis-Plus 配置 ==========
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.agent.infrastructure.persistence.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0




# ========== 日志配置 ==========
logging:
  level:
    com.agent: DEBUG  # 改为 DEBUG 级别，可查看 Planner/Worker/Replanner 的完整 Prompt
    org.springframework.ai: INFO

# ========== Actuator 健康检查配置 ==========
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    defaults:
      enabled: true



# ========== 上下文系统配置 ==========
context:
  workspace:
    base-path: /Users/jaron/Downloads/test  # 工作空间根路径（MCP filesystem 路径）
  assembly:
    include-recent-output: true
    max-history-steps: 20
  summary:
    fallback-enabled: true

# ========== Skill 系统配置 ==========
skill:
  user-directory: /Users/jaron/Downloads/test/skills # 用户 Skill 目录
  project-directory: /Users/jaron/Downloads/test/skills # 项目 Skill 目录
  auto-load: true  # 自动加载 Skill

# ========== Sandbox 配置 ==========
sandbox:
  enabled: true                          # 开启
  # Docker 模式（默认本地 Docker）
  # 如果 sandbox server 跑在远端，改成远端地址
  #base-url: http://localhost:8000

