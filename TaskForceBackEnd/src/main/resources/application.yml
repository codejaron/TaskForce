server:
  port: 8080

spring:
  application:
    name: mcp-host
  profiles:
    active: local

  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  
  # ========== Nacos 服务发现 ==========
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        enabled: true
    
    # ========== LoadBalancer 配置 ==========
    loadbalancer:
      ribbon:
        enabled: false  # 使用 Spring Cloud LoadBalancer 而非 Ribbon
      cache:
        enabled: true
        ttl: 35s  # 缓存服务实例列表 35 秒

  # ========== Redis 配置 ==========
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      timeout: 3000ms

  # ========== 数据源配置 ==========
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # ========== SQL 初始化 ==========
  sql:
    init:
      mode: never  # 改为never，只在首次部署时手动执行schema.sql
      schema-locations: classpath:db/migration/schema.sql
      continue-on-error: true



  # ========== 异步任务线程池配置 ==========
  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100
        keep-alive: 60s
      thread-name-prefix: async-task-

# ========== MyBatis-Plus 配置 ==========
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.agent.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0



# ========== 日志配置 ==========
logging:
  level:
    com.agent: DEBUG  # 改为 DEBUG 级别，可查看 Planner/Worker/Replanner 的完整 Prompt
    org.springframework.ai: INFO

# ========== Actuator 健康检查配置 ==========
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    defaults:
      enabled: true


# ========== RocketMQ 配置 ==========
rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:localhost:9876}
  producer:
    group: taskforce-producer
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

# ========== 应用配置 ==========
app:
  idempotent:
    expire-hours: 24  # 幂等 key 过期时间（小时）

