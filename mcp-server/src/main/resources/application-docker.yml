server:
  port: 8082

spring:
  # ========== 数据源配置 ==========
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # ========== Redis 配置（Provider 同步广播） ==========
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      database: ${SPRING_REDIS_DATABASE:0}
      timeout: ${SPRING_REDIS_TIMEOUT:5s}

  # ========== SQL 初始化 ==========
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

# ========== MCP 同步配置 ==========
mcp:
  provider-sync:
    channel: ${MCP_PROVIDER_SYNC_CHANNEL:mcp-provider-sync}
    instance-id: ${MCP_PROVIDER_SYNC_INSTANCE_ID:${spring.application.name}-${random.uuid}}

# ========== 日志配置 ==========
logging:
  level:
    root: INFO
    com.agent.mcpserver: ${LOG_LEVEL_MCP_SERVER:INFO}
    com.agent.mcpserver.controller.McpStreamableHttpController: ${LOG_LEVEL_MCP_HTTP:WARN}
    com.agent.mcpserver.service.McpProtocolHandler: ${LOG_LEVEL_MCP_PROTOCOL_HANDLER:WARN}
    io.modelcontextprotocol: ${LOG_LEVEL_MCP_PROTOCOL:WARN}
    org.apache.ibatis: ${LOG_LEVEL_MYBATIS:WARN}
    com.baomidou.mybatisplus: ${LOG_LEVEL_MYBATIS_PLUS:WARN}
