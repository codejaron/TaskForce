server:
  port: 8082

spring:
  application:
    name: mcp-server
  profiles:
    active: local

  # ========== Spring AI MCP Client 配置 ==========
  ai:
    mcp:
      client:
        enabled: false  # 禁用声明式自动配置，使用数据库动态管理

  # ========== Nacos 服务发现 ==========
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        enabled: true

  # ========== 数据源配置 ==========
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mcp_server?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # ========== Redis 配置（Provider 同步广播） ==========
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      database: ${SPRING_REDIS_DATABASE:0}
      timeout: ${SPRING_REDIS_TIMEOUT:5s}

  # ========== SQL 初始化 ==========
  sql:
    init:
      mode: always  # 改为never，只在首次部署时手动执行schema.sql
      schema-locations: classpath:schema.sql
      continue-on-error: true

# ========== MyBatis-Plus 配置 ==========
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ========== MCP Server 配置 ==========
mcp:
  # Native 工具扫描包路径
  native:
    scan-packages: ${MCP_NATIVE_SCAN_PACKAGES:com.agent.mcpserver.tool}
  # MCP Client 池配置（可按类型调整默认并发）
  client-pool:
    stdio-default-size: ${MCP_CLIENT_POOL_STDIO_SIZE:3}
    remote-sse-default-size: ${MCP_CLIENT_POOL_REMOTE_SSE_SIZE:4}
    streamable-http-default-size: ${MCP_CLIENT_POOL_STREAMABLE_HTTP_SIZE:8}
    acquire-timeout-seconds: ${MCP_CLIENT_POOL_ACQUIRE_TIMEOUT_SECONDS:8}
    max-pool-size: ${MCP_CLIENT_POOL_MAX_SIZE:20}
  provider-sync:
    channel: ${MCP_PROVIDER_SYNC_CHANNEL:mcp-provider-sync}
    instance-id: ${MCP_PROVIDER_SYNC_INSTANCE_ID:${spring.application.name}-${random.uuid}}

# ========== 日志配置 ==========
logging:
  level:
    root: INFO
    com.agent.mcpserver: ${LOG_LEVEL_MCP_SERVER:INFO}
    com.agent.mcpserver.controller.McpStreamableHttpController: ${LOG_LEVEL_MCP_HTTP:WARN}
    com.agent.mcpserver.service.McpProtocolHandler: ${LOG_LEVEL_MCP_PROTOCOL_HANDLER:WARN}
    io.modelcontextprotocol: ${LOG_LEVEL_MCP_PROTOCOL:WARN}
    org.apache.ibatis: ${LOG_LEVEL_MYBATIS:WARN}
    com.baomidou.mybatisplus: ${LOG_LEVEL_MYBATIS_PLUS:WARN}

# ========== Actuator 健康检查 ==========
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always



# ========== 本地工具配置 ==========
workspace:
  base-path: /Users/jaron/Downloads/test
  ripgrep-path: rg
  max-output-lines: 3000
  max-output-bytes: 50000
  bash-default-timeout-ms: 120000
  read-default-limit: 2000
  read-max-line-length: 2000
