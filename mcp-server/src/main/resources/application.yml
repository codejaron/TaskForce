server:
  port: 8081

spring:
  application:
    name: mcp-server
  
  # 数据源配置
  datasource:
    # 默认使用 H2 内存数据库（开发环境）
    url: ${DB_URL:jdbc:h2:mem:mcpserver;DB_CLOSE_DELAY=-1;MODE=MySQL}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  
  # H2 控制台（开发环境）
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# MCP Server 配置
mcp:
  # 配置来源：database, file, both
  config-source: ${MCP_CONFIG_SOURCE:file}
  # 配置文件路径
  config-path: ${MCP_CONFIG_PATH:./mcp-server-config.json}

# 日志配置
logging:
  level:
    root: INFO
    com.agent.mcpserver: DEBUG
    io.modelcontextprotocol: DEBUG

# Actuator 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
