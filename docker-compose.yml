services:
  # ========== Redis ==========
  redis:
    # 使用阿里云镜像（如果 Docker Hub 访问有问题）
    # image: registry.cn-hangzhou.aliyuncs.com/library/redis:7-alpine
    image: redis:7-alpine
    container_name: taskforce-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - taskforce-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ========== MySQL ==========
  mysql:
    image: mysql:8.0
    container_name: taskforce-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-TaskForce123456}
      MYSQL_DATABASE: taskforce
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./TaskForceBackEnd/src/main/resources/db/migration/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - taskforce-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-TaskForce123456}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./TaskForceBackEnd
      dockerfile: Dockerfile
    container_name: taskforce-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/taskforce?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-TaskForce123456}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # MCP Server
      MCP_SERVER_URL: http://mcp-server:8082
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./workspace:/app/workspace
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    networks:
      - taskforce-network

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    # container_name: taskforce-mcp-server  # 删除固定名字，支持多实例
    restart: always
    deploy:
      replicas: 1  # 先保持 1，以后改成 3
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mcp_server?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-TaskForce123456}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    ports:
      - "${MCP_SERVER_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taskforce-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: TaskForceFrontEnd
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: taskforce-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - taskforce-network

volumes:
  mysql-data:
  redis-data:

networks:
  taskforce-network:
    driver: bridge
