services:
  # ========== RocketMQ ==========
  namesrv:
    image: apache/rocketmq:5.1.0
    platform: linux/amd64
    container_name: taskforce-namesrv
    restart: always
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    command: sh mqnamesrv
    networks:
      - taskforce-network
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 9876 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  broker:
    image: apache/rocketmq:5.1.0
    platform: linux/amd64
    container_name: taskforce-broker
    user: "0:0"
    restart: always
    ports:
      - "${ROCKETMQ_BROKER_PORT:-10911}:10911"
    environment:
      NAMESRV_ADDR: namesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
      ROCKETMQ_HOME: /home/rocketmq/rocketmq-5.1.0
      HOME: /home/rocketmq
    command: >
      sh -c "
        mkdir -p /home/rocketmq/store/config /home/rocketmq/store/commitlog /home/rocketmq/logs &&
        sh mqbroker -c /home/rocketmq/rocketmq-5.1.0/conf/broker.conf
      "
    depends_on:
      namesrv:
        condition: service_healthy
    networks:
      - taskforce-network
    volumes:
      - broker-data:/home/rocketmq/store
      - broker-logs:/home/rocketmq/logs
      - ./broker.conf:/home/rocketmq/rocketmq-5.1.0/conf/broker.conf:ro

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: taskforce-rocketmq-dashboard
    restart: always
    ports:
      - "${ROCKETMQ_DASHBOARD_PORT:-18080}:8080"
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=namesrv:9876"
    depends_on:
      - namesrv
      - broker
    networks:
      - taskforce-network

  # ========== Redis ==========
  redis:
    # 使用阿里云镜像（如果 Docker Hub 访问有问题）
    # image: registry.cn-hangzhou.aliyuncs.com/library/redis:7-alpine
    image: redis:7-alpine
    container_name: taskforce-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - taskforce-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ========== MySQL ==========
  mysql:
    image: mysql:8.0
    container_name: taskforce-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-TaskForce123456}
      MYSQL_DATABASE: taskforce
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./TaskForceBackEnd/src/main/resources/db/migration/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - taskforce-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-TaskForce123456}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./TaskForceBackEnd
      dockerfile: Dockerfile
    container_name: taskforce-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/taskforce?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-TaskForce123456}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
      # RocketMQ
      ROCKETMQ_NAMESRV: namesrv:9876
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./mcp-config.json:/app/mcp-config.json
      - ./mcp-tools:/app/mcp-tools:ro
      - ./workspace:/app/workspace
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      namesrv:
        condition: service_healthy
      broker:
        condition: service_started
    networks:
      - taskforce-network

  frontend:
    build:
      context: TaskForceFrontEnd
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: taskforce-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - taskforce-network

volumes:
  mysql-data:
  redis-data:
  broker-data:
  broker-logs:

networks:
  taskforce-network:
    driver: bridge

